plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.carlosphenomenal'
version = '0.2.0-SNAPSHOT'
description = 'DR41'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Jackson 3 YAML support (version managed by the Spring Boot BOM). Needed to parse YAML test plans.
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.github.oshi:oshi-core:6.6.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Keep the tool's own footprint small while it supervises k6.
tasks.named('bootRun') {
    jvmArgs '-XX:+UseSerialGC', '-Xms64m', '-Xmx256m'
}
